<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <title>Canadian News Aggregate</title>
</head>
<body>

    <div class="container">
        <main class="feed">
            <div th:if="${articles == null or #lists.isEmpty(articles)}">
                <p>No articles found.</p>
            </div>

            <ul>
                <li th:each="article : ${articles}">
                    <h2>
                        <a th:href="${article.link}"
                           th:text="${article.title}"
                           target="_blank"
                           rel="noopener noreferrer">Article Title</a>
                    </h2>
                    <h3 th:if="${article.isToday()}">This article is new today!</h3>
                    <p class="deets">
                        <strong>Source:</strong> <span th:text="${article.sourceName}">Source</span> <br>
                        <strong>Date:</strong> <span th:text="${article.publishedDate}">Date</span> <br>
                        <strong>Tags:</strong> <span th:text="${article.getTags()}"></span>
                    </p>
                    <p th:if="${article.aiSummary != null}" th:text="${article.aiSummary}">Summary text...</p>
                    <a th:href="${article.link}" target="_blank" rel="noopener noreferrer">Read Original</a>
                </li>
            </ul>
        </main>
        <aside class="sidebar">
            <h1>Canadian News & Policy Aggregate</h1>
            <search>
                <form th:action="@{/}" method="GET">
                    <input th:if="${activeTags != null and !activeTags.isEmpty()}"
                           type="hidden"
                           name="tags"
                           th:value="${#strings.listJoin(activeTags, ',')}">
                    <label>
                        <input type="search"
                                name="q"
                                th:value="${query}"
                                placeholder="Refine your search...">
                    </label>
                    <div class="limit-selector">
                        <label for="limit-select">Articles per page:</label>
                        <select id="limit-select" name="limit" onchange="this.form.submit()">
                            <option value="10" th:selected="${limit == 10}">10</option>
                            <option value="20" th:selected="${limit == 20 or limit == null}">20 (default)</option>
                            <option value="30" th:selected="${limit == 30}">30</option>
                            <option value="40" th:selected="${limit == 40}">40</option>
                            <option value="50" th:selected="${limit == 50}">50</option>
                        </select>
                    </div>
                </form>
            </search>

            <div class="tags">
                <a th:each="tag : ${availableTags}"
                   th:text="${tag}"
                   th:href="@{${controller.buildUrlParams(activeTags, tag, query, limit)}}"
                   class="tag-pill"
                   th:classappend="${activeTags.contains(tag)} ? 'active' : ''">
                    Tag
                </a>
            </div>

            <div class="stats">
                <p><strong>Total Articles Processed: </strong><span th:text="${totalArticles}">0</span></p>
                <p><strong>Articles Deemed Relevant: </strong><span th:text="${totalRelevantArticles}">0</span></p>
            </div>
            <footer>Made by Spencer Al-Jbouri</footer>
        </aside>
    </div>


    <noscript>
        <img src="https://analytics.spenceralj.com/ingress/5da15505-1a87-4cc2-ad86-bdd1933536d7/pixel.gif">
    </noscript>
    <script defer src="https://analytics.spenceralj.com/ingress/5da15505-1a87-4cc2-ad86-bdd1933536d7/script.js"></script>
</body>
</html>
