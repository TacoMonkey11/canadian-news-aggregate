# Test Database Configuration (In-Memory H2 for fast unit/integration testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Google GenAI test configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:test-dummy-api-key}
spring.ai.google.genai.chat.model=gemini-2.5-flash
